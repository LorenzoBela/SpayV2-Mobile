name: Weekly Security & Typecheck Audit

on:
  schedule:
    - cron: '0 2 * * 0' # Every Sunday 10:00 AM PHT
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Security audit (high/critical)
        run: npm audit --audit-level=high
